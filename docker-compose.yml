services:
  trinitycore-wowserver:
    image: danielsilvestre37/trinitycore-docker:3.3.5
    container_name: trinitycore-wowserver
    restart: unless-stopped
    environment:
      # Must be the IP clients connect to (LAN IP of this VM). Written into
      # auth.realmlist at bootstrap — change it if you move the VM.
      - PUBLIC_IP_ADDRESS=192.168.1.64
      - REALM_NAME=Pandora
      # Web UI credentials (port 3000)
      - ACCESS_USERNAME=admin
      - ACCESS_PASSWORD=admin
      # Rate tuning (uncomment to customize) — TC_WORLD__ prefix maps to
      # worldserver.conf, "." becomes "__".
      # - TC_WORLD__Rate__XP__Kill=3
      # - TC_WORLD__Rate__Drop__Money=2
      # Improve movement-metric freshness for the observability stack (5 s saves).
      - TC_WORLD__PlayerSaveInterval=5000
      # - TC_WORLD__PlayerLimit=50
      # - TC_WORLD__Motd=Welcome to Pandora
      # ChatLogScript needs Logger.chat.log=3,Console Server. This image maps
      # dots to __ for ordinary keys, but this logger key contains a dot itself;
      # verify TC_WORLD__Logger__chat__log against the generated worldserver.conf
      # on the target image before relying on this override (see chat-feed README).
      - TC_WORLD__Logger__chat__log=3,Console Server
      # Telnet remote-admin console on port 3443 (Ra.Port default) — scripted
      # GM/account commands without a TTY, alongside scripts/wow_console.py's
      # web UI socket.io route. Enabled directly on the VM; tracked here so a
      # redeploy doesn't silently disable it.
      - TC_WORLD__Ra.Enable=1
    volumes:
      - server_data:/app/server/data
      - server_logs:/app/server/logs
      - ./client:/app/client          # WoW 3.3.5a client files (read for map extraction)
      # REQUIRED. The image downloads the *newest* TDB release, but the bundled
      # worldserver binary is compiled expecting one specific filename. Without
      # this mount, bootstrap fails at "Updating application database" and the
      # container restart-loops. See docs/DEPLOYMENT.md.
      - ./tdb/TDB_full_world_335.25101_2025_10_21.sql:/app/server/bin/TDB_full_world_335.25101_2025_10_21.sql
      - type: tmpfs
        target: /app/tmp
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8085:8085"   # World server
      - "3724:3724"   # Auth server (logon)
      - "3000:3000"   # Web UI
      - "3443:3443"   # Telnet remote-admin console (Ra.Enable above)
    deploy:
      resources:
        # Must fit the VM's TOTAL RAM. 6 GB VM: 5g limit / 3g reservation here
        # + 1g for MySQL. An 8g limit on a 6 GB VM is unsatisfiable.
        limits:
          cpus: "4.0"
          memory: "5g"
        reservations:
          cpus: "2.0"
          memory: "3g"

  chat-feed:
    build: ./tools/chat-feed
    container_name: chat-feed
    restart: unless-stopped
    environment:
      - LOG_PATH=/logs/Server.log
      - REPLAY_BUFFER_SIZE=200
      - LISTEN_PORT=9500
      - CHAT_FEED_CHANNELS=say,yell,channel
    volumes:
      - server_logs:/logs:ro
    depends_on:
      trinitycore-wowserver:
        condition: service_started
    ports:
      - "9500:9500"

  database:
    image: mysql:8.4.4
    container_name: trinitycore-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: trinityroot
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"   # Direct DB access for ad-hoc queries / review verification
    deploy:
      resources:
        limits:
          memory: "1g"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ptrinityroot"]
      interval: 10s
      timeout: 30s
      retries: 3

volumes:
  db_data:
  server_data:
  server_logs:
