# Monitoring compose for the wow-server VM (192.168.1.64), scraped by the external
# Prometheus/Grafana on the docker-stack VM (192.168.1.60).
#
# Runs as a SEPARATE compose project (name "monitoring", from this directory's
# basename) from the game stack, so it survives `docker compose down -v` in the
# repo root even though both live in the same git checkout.
#
# Build contexts are relative to this file (../exporters/wow-exporter,
# ../tools/wowmap), so this runs straight from the repo checkout — no more
# copying source into /opt/monitoring or /opt/wowmap. See scripts/deploy.sh.
#
# Exposes:
#   :9100  node-exporter     host CPU / RAM / disk / net
#   :8080  cadvisor          per-container CPU / RAM / net
#   :9300  wow-exporter      GAME metrics (players online, characters, activity...)
#   :9400  wowmap            live map page + JSON API + map art
#
# Prometheus jobs (add to /opt/pandora/prometheus/prometheus.yml on VM201):
#
#   - job_name: "node_wow"      targets: ["192.168.1.64:9100"]  labels: {host: "wow-server"}
#   - job_name: "cadvisor_wow"  targets: ["192.168.1.64:8080"]  labels: {host: "wow-server"}
#   - job_name: "wow_game"      targets: ["192.168.1.64:9300"]  labels: {host: "wow-server"}
#
# Grafana dashboards are file-provisioned, see grafana/provisioning/dashboards.yaml.
# Drop raw dashboard JSONs into /opt/pandora/grafana/dashboards-wow/.

services:
  node-exporter:
    container_name: node-exporter
    image: prom/node-exporter:latest
    restart: unless-stopped
    network_mode: host
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"

  cadvisor:
    container_name: cadvisor
    image: gcr.io/cadvisor/cadvisor:latest
    restart: unless-stopped
    privileged: true
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg

  wow-exporter:
    container_name: wow-exporter
    build: ../exporters/wow-exporter
    restart: unless-stopped
    environment:
      - MYSQL_HOST=trinitycore-db
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=trinityroot
      - LISTEN_PORT=9300
      - TOP_PLAYED=20
    ports:
      - "9300:9300"
    networks:
      - wow-game

  wowmap:
    container_name: wowmap
    build: ../tools/wowmap
    restart: unless-stopped
    environment:
      - MYSQL_HOST=trinitycore-db
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=trinityroot
      - DBC_DIR=/dbc
      - MAPS_DIR=/maps
      - LISTEN_PORT=9400
      - CALIBRATION_FILE=/app/calibration.json
    ports:
      - "9400:9400"
    volumes:
      - /opt/wowmap-data/dbc:/dbc:ro
      - /opt/wowmap-data/maps:/maps:ro
      - /opt/wowmap-data/calibration.json:/app/calibration.json
    networks:
      - wow-game

networks:
  wow-game:
    external: true
    name: wow-server_default
