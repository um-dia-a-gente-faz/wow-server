# Monitoring compose for the wow-server VM (192.168.1.64), scraped by the external
# Prometheus/Grafana on the docker-stack VM (192.168.1.60).
#
# Runs as a SEPARATE compose project (name "monitoring", from this directory's
# basename) from the game stack, so it survives `docker compose down -v` in the
# repo root even though both live in the same git checkout.
#
# Build contexts are relative to this file (../exporters/wow-exporter,
# ../tools for wowmap), so this runs straight from the repo checkout — no more
# copying source into /opt/monitoring or /opt/wowmap. See scripts/deploy.sh.
#
# MYSQL_PASSWORD is interpolated from the repo-root .env. Compose only auto-loads
# .env from the project directory (monitoring/), so always pass it explicitly:
#
#   docker compose --env-file .env -f monitoring/docker-compose.yml up -d --build
#
# Exposes:
#   :9100  node-exporter     host CPU / RAM / disk / net
#   :8080  cadvisor          per-container CPU / RAM / net
#   :9300  wow-exporter      GAME metrics (players online, characters, activity...)
#   :9400  wowmap            live map page + JSON API + map art
#
# Prometheus jobs (add to /opt/pandora/prometheus/prometheus.yml on VM201):
#
#   - job_name: "node_wow"      targets: ["192.168.1.64:9100"]  labels: {host: "wow-server"}
#   - job_name: "cadvisor_wow"  targets: ["192.168.1.64:8080"]  labels: {host: "wow-server"}
#   - job_name: "wow_game"      targets: ["192.168.1.64:9300"]  labels: {host: "wow-server"}
#   - job_name: "wow_chat_feed" targets: ["192.168.1.64:9500"]  labels: {host: "wow-server"}
#     (tools/chat-feed, which runs from the root docker-compose.yml)
#
# Grafana dashboards are file-provisioned, see grafana/provisioning/dashboards.yaml.
# Drop raw dashboard JSONs into /opt/pandora/grafana/dashboards-wow/.

services:
  node-exporter:
    container_name: node-exporter
    image: prom/node-exporter:latest
    restart: unless-stopped
    network_mode: host
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      # Textfile collector dir for monitoring/agent_metrics_textfile.py
      # (UM-51 agent decision-audit metrics — no long-running agent process
      # to attach an HTTP /metrics server to, so this is node-exporter's
      # generic escape hatch instead of a new port/service).
      - /opt/wow-server-metrics/textfile:/textfile:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
      - "--collector.textfile.directory=/textfile"

  cadvisor:
    container_name: cadvisor
    image: gcr.io/cadvisor/cadvisor:latest
    restart: unless-stopped
    privileged: true
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg

  wow-exporter:
    container_name: wow-exporter
    build: ../exporters/wow-exporter
    restart: unless-stopped
    environment:
      - MYSQL_HOST=trinitycore-db
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in the repo-root .env}
      - LISTEN_PORT=9300
      - TOP_PLAYED=20
    ports:
      - "9300:9300"
    networks:
      - wow-game

  wowmap:
    container_name: wowmap
    build:
      context: ../tools          # tools/ so the image also gets the shared tools/dbc reader
      dockerfile: wowmap/Dockerfile
    restart: unless-stopped
    environment:
      - MYSQL_HOST=trinitycore-db
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in the repo-root .env}
      - DBC_DIR=/dbc
      - MAPS_DIR=/maps
      - ICONS_DIR=/icons
      - GRID_MAPS_DIR=/server-data/maps
      - LISTEN_PORT=9400
      - CALIBRATION_FILE=/app/calibration.json
      # UM-76 activity feed: SQLite store (last 500 events per character), the
      # chat-feed container on the shared wow-game network, and the agents' audit logs.
      - ACTIVITY_DB=/data/activity.sqlite3
      - ACTIVITY_CHAT_FEED_URL=http://chat-feed:9500
      - AUDIT_DIR=/audit
      # UM-50: agents' read-only APIs, "Name=http://host:9601,..." (empty = no agent mind tab)
      - AGENT_API_URLS=${AGENT_API_URLS:-}
      # #137: the agent runner behind the Fleet panel (tools/agent-runner). Empty URL = the
      # panel is read-only. The token stays inside wowmap; the browser never sees it.
      - AGENT_RUNNER_URL=${AGENT_RUNNER_URL:-}
      - AGENT_RUNNER_TOKEN=${AGENT_RUNNER_TOKEN:-}
    ports:
      - "9400:9400"
    volumes:
      - /opt/wowmap-data/dbc:/dbc:ro
      - /opt/wowmap-data/maps:/maps:ro
      # Item icons from tools/wowmap/extract_icons.py. Until it has been run, Docker
      # creates this directory empty and the inspect drawer shows placeholders.
      - /opt/wowmap-data/icons:/icons:ro
      - /opt/wowmap-data/calibration.json:/app/calibration.json
      - /opt/wowmap-data/activity:/data
      - /opt/wow-server-metrics/audit:/audit:ro
      # The worldserver's extracted maps/*.map, read-only: subzone at a position (UM-75).
      - server_data:/server-data:ro
    networks:
      - wow-game

networks:
  wow-game:
    external: true
    name: wow-server_default

volumes:
  server_data:
    external: true
    name: wow-server_server_data
