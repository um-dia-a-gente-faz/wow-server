# Pre-merge safety net: syntax, unit tests, compose/dashboard validation,
# secret scan and the agent image build. No access to the LAN VMs from here;
# live verification on 192.168.1.64 stays manual (see CONTRIBUTING.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python (compile + unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: py_compile
        run: |
          find agent tools exporters scripts -name '*.py' -print0 \
            | xargs -0 python -m py_compile

      # tools/chat-feed is stdlib-only (its requirements.txt is intentionally
      # empty). If a tool's tests ever need deps, install that tool's
      # requirements.txt here, never for agent/ (stdlib only).
      - name: chat-feed unit tests
        run: python -m unittest discover -s tools/chat-feed/tests -v

      # tools/dbc (the shared WDBC reader) is stdlib-only.
      - name: dbc unit tests
        run: python -m unittest discover -s tools/dbc/tests -v

      # Offline: pull-audit.sh / audit-pull-status.sh against temp dirs with a fake
      # rsync (#135). Plain bash + coreutils, no network.
      - name: wow-agents audit pull tests
        run: |
          for f in scripts/wow-agents/*.sh; do bash -n "$f"; done
          python -m unittest discover -s scripts/wow-agents/tests -v

      # #253: the agent's real auth + world client against tools/world-mock over
      # localhost sockets: SRP6 login, update objects, quest turn-in, confirmation.
      - name: world-mock end-to-end (login + quest turn-in)
        run: python -m unittest discover -s tools/world-mock/tests -v

      - name: jev-mock unit tests
        run: python -m unittest discover -s tools/jev-mock/tests -v

      # tools/agent-runner is stdlib-only; its tests use a fake `docker` on PATH.
      - name: agent-runner unit tests
        run: python -m unittest discover -s tools/agent-runner/tests -v

      # UM-100: the real JevClient against jev-mock as a separate process, over
      # real HTTP. Real Jev (paid, needs a key) never runs in CI.
      - name: JevClient against a running jev-mock
        run: |
          PORT=8090 python tools/jev-mock/server.py &
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8090/healthz && break
            sleep 0.5
          done
          JEV_MOCK_URL=http://127.0.0.1:8090/api/alpha \
            python -m unittest -v tools/jev-mock/tests/test_external.py

      # wowmap needs PyMySQL + cryptography (see its requirements.txt), and Pillow
      # for the extract_maps.py / extract_icons.py tests (offline tools, not in the image).
      - name: wowmap unit tests
        run: |
          pip install -r tools/wowmap/requirements.txt Pillow
          python -m unittest discover -s tools/wowmap/tests -v

      # #262: pure front-end functions (tools/wowmap/static/*.js) under node's built-in runner.
      # Node is preinstalled on ubuntu-latest; the shell expands the glob so any node >= 18 works.
      - name: wowmap JS unit tests
        run: |
          node --version
          node --test tools/wowmap/tests/js/*.test.js

      - name: agent unit tests
        run: |
          if [ -d agent/tests ]; then
            python -m unittest discover -s agent/tests -v
          else
            echo "agent/tests not present yet, skipping"
          fi

  lint-typing:
    name: lint + types (ruff, mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Dev tools live only here; agent/ stays stdlib-only at runtime.
      - run: pip install -r requirements-dev.txt
      # Config + baseline in ruff.toml; fails on any violation not in per-file-ignores.
      - name: ruff check
        run: ruff check .
      # Allowlist of typed files in mypy.ini (`files =`); everything else is unchecked.
      - name: mypy (allowlist)
        run: mypy

  # #253: informational only (continue-on-error), never gates a merge. `coverage`
  # is installed here on the runner and is not a dependency of agent/ (stdlib only).
  coverage:
    name: coverage report (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run agent + world-mock tests under coverage
        run: |
          pip install coverage
          coverage run --source=agent -m unittest discover -s agent/tests
          coverage run -a --source=agent -m unittest discover -s tools/world-mock/tests
      - name: Report (modules with the least coverage first)
        run: |
          {
            echo '### Coverage of agent/ (informational)'
            echo '```'
            coverage report --skip-empty --sort=cover
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  compose:
    name: compose config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # Compose reads .env from the project directory; seed it from the
      # example (dummy values) once one exists so interpolation resolves.
      - name: Dummy env file
        run: if [ -f .env.example ] && [ ! -f .env ]; then cp .env.example .env; fi
      - name: Validate compose files
        # --project-directory . keeps the project dir (and thus .env lookup)
        # at the repo root even for compose files in subdirectories;
        # otherwise monitoring/docker-compose.yml misses the root .env.
        run: |
          for f in docker-compose.yml monitoring/docker-compose.yml docker-compose.agents.yml; do
            echo "::group::$f"
            docker compose --project-directory . -f "$f" config -q
            echo "::endgroup::"
          done

  dashboards:
    name: grafana dashboards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Validate dashboard JSON
        run: |
          rc=0
          for f in monitoring/grafana-dashboard-*.json; do
            python3 -m json.tool "$f" > /dev/null || { echo "::error file=$f::invalid JSON"; rc=1; }
          done
          exit $rc

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Scans only the new commits (PR base..head, or the pushed range on
      # main) so the known historical leak tracked in UM-26 does not fail
      # every run. Runs the gitleaks binary directly instead of
      # gitleaks-action, which now requires a paid GITLEAKS_LICENSE
      # (https://github.com/gitleaks/gitleaks-action#-announcement).
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
      - name: Run gitleaks
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            LOG_OPTS="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              LOG_OPTS="-1"
            else
              LOG_OPTS="${BEFORE}..${{ github.sha }}"
            fi
          fi
          ./gitleaks git --log-opts="$LOG_OPTS" -v --redact

  docker-build:
    name: docker build (agent image)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Build (no push)
        run: docker build -t wow-agent:ci .
