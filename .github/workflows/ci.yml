# Pre-merge safety net: syntax, unit tests, compose/dashboard validation,
# secret scan and the agent image build. No access to the LAN VMs from here;
# live verification on 192.168.1.64 stays manual (see CONTRIBUTING.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # #399: decides which jobs a PR needs. Push to main and any change to CI, scripts,
  # lint/type config or the Dockerfile run everything. lint-typing and gitleaks always run.
  changes:
    name: changes (path filter)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      agent: ${{ steps.f.outputs.agent }}
      tools: ${{ steps.f.outputs.tools }}
      compose: ${{ steps.f.outputs.compose }}
      backup: ${{ steps.f.outputs.backup }}
      wowmap: ${{ steps.f.outputs.wowmap }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: f
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          files=""
          if [ "$EVENT" = "pull_request" ]; then files=$(git diff --name-only "$BASE...$HEAD"); fi
          hit() { [ "$EVENT" != "pull_request" ] || grep -Eq "$1" <<<"$files"; }
          all='^(\.github/workflows/ci\.yml|scripts/|Dockerfile|\.dockerignore|requirements|ruff\.toml|mypy\.ini)'
          {
            echo "agent=$(hit "$all|^agent/|^coverage-floors\.json$" && echo true || echo false)"
            echo "tools=$(hit "$all|^(agent|agents|tools|monitoring)/|^exporters/wow-exporter/requirements\.txt|^docker-compose[^/]*\.yml|^docs/AGENT-API\.md" && echo true || echo false)"
            echo "compose=$(hit "$all|(^|/)Dockerfile$|(^|/)docker-compose[^/]*\.yml$|^monitoring/|^\.env\.example" && echo true || echo false)"
            echo "backup=$(hit "$all|^docker-compose[^/]*\.yml" && echo true || echo false)"
            echo "wowmap=$(hit "$all|^tools/(wowmap|dbc|common|chat-feed)/" && echo true || echo false)"
          } | tee -a "$GITHUB_OUTPUT"

  # The single required check (#399). Skipped by the path filter counts as passing;
  # failed or cancelled needed jobs fail it. Gate on this job only. The coverage
  # job (#384) is a gate too, so it is needed here.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, agent, coverage, tools, lint-typing, compose, secrets, docker-build, docker-build-wowmap, backup-restore]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needed results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "::error::a needed job ended $r"; exit 1;; esac
          done
  # agent/ is stdlib-only: this job installs nothing, so a third-party import fails here.
  agent:
    name: agent (compile + stdlib-only tests)
    needs: changes
    if: needs.changes.outputs.agent == 'true' || needs.changes.outputs.tools == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: scripts/check.sh compile test-stdlib

  # Every other suite, registered in scripts/check.sh (#298). wowmap needs PyMySQL +
  # cryptography (its requirements.txt) and Pillow; node is preinstalled on ubuntu-latest.
  tools:
    name: tools (unit tests, generated files)
    needs: changes
    if: needs.changes.outputs.tools == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/wowmap/requirements.txt
      - run: pip install --require-hashes -r tools/wowmap/requirements.txt
      - run: pip install --require-hashes -r exporters/wow-exporter/requirements.txt
      - run: scripts/check.sh generated test-tools

      # UM-100: the real JevClient against jev-mock as a separate process, over
      # real HTTP. Real Jev (paid, needs a key) never runs in CI.
      - name: JevClient against a running jev-mock
        run: |
          PORT=8090 python tools/jev-mock/server.py &
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8090/healthz && break
            sleep 0.5
          done
          JEV_MOCK_URL=http://127.0.0.1:8090/api/alpha \
            python -m unittest -v tools/jev-mock/tests/test_external.py

  lint-typing:
    name: lint + types (ruff, mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      # Dev tools live only here; agent/ stays stdlib-only at runtime.
      - run: pip install -r requirements-dev.txt
      # Config + baseline in ruff.toml; fails on any violation not in per-file-ignores.
      - name: ruff check
        run: scripts/check.sh lint
      # All of agent/ in tiers (mypy.ini); the legacy list is guarded by scripts/tests.
      - name: mypy (tiers)
        run: scripts/check.sh types

  # #384: a gate. The floor is in coverage-floors.json and scripts/coverage_floor.py fails when
  # the total is below it or 1.5 points above it (raise the number in the same PR).
  # `coverage` comes from requirements-dev.txt, never from agent/ (stdlib only).
  coverage:
    name: coverage (agent floor)
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Agent + world-mock tests under coverage, against the floor
        run: |
          set -o pipefail
          { echo '### Coverage of agent/'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          rc=0
          scripts/check.sh coverage | tee -a "$GITHUB_STEP_SUMMARY" || rc=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $rc

  compose:
    name: compose config
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # Compose reads .env from the project directory; seed it from the
      # example (dummy values) once one exists so interpolation resolves.
      - name: Dummy env file
        run: if [ -f .env.example ] && [ ! -f .env ]; then cp .env.example .env; fi
      - name: No :latest images (#291)
        run: |
          # every image:/FROM line needs a digest (or the agent tag variable); this also rejects :latest, quoted or not
          if git grep -nE '^\s*(image:|FROM)\s' -- ':(glob)**/docker-compose*.yml' ':(glob)**/Dockerfile' | grep -vE '@sha256:[0-9a-f]{64}|\$\{WOW_AGENT_TAG'; then
            echo "::error::pin images by version and digest, never :latest (docs/DEPLOYMENT.md, Bumping pins)"; exit 1
          fi
      - name: Validate compose files
        # --project-directory . keeps the project dir (and thus .env lookup)
        # at the repo root even for compose files in subdirectories;
        # otherwise monitoring/docker-compose.yml misses the root .env.
        run: |
          for f in docker-compose.yml monitoring/docker-compose.yml docker-compose.agents.yml; do
            echo "::group::$f"
            docker compose --project-directory . -f "$f" config -q
            echo "::endgroup::"
          done

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Scans only the new commits (PR base..head, or the pushed range on
      # main) so the known historical leak tracked in UM-26 does not fail
      # every run. Runs the gitleaks binary directly instead of
      # gitleaks-action, which now requires a paid GITLEAKS_LICENSE
      # (https://github.com/gitleaks/gitleaks-action#-announcement).
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
      - name: Run gitleaks
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            LOG_OPTS="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              LOG_OPTS="-1"
            else
              LOG_OPTS="${BEFORE}..${{ github.sha }}"
            fi
          fi
          ./gitleaks git --log-opts="$LOG_OPTS" -v --redact

  docker-build:
    name: docker build (agent image)
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: wow-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The wowmap and chat-feed images (#392, #451): their Dockerfiles' RUN import smoke tests run
  # here, before merge. Both build from the tools/ context (ADR 0014).
  docker-build-wowmap:
    name: docker build (wowmap image)
    needs: changes
    if: needs.changes.outputs.wowmap == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: tools
          file: tools/wowmap/Dockerfile
          push: false
          tags: wowmap:ci
          cache-from: type=gha,scope=wowmap
          cache-to: type=gha,mode=max,scope=wowmap
      - name: Build chat-feed (no push)
        uses: docker/build-push-action@v6
        with:
          context: tools
          file: tools/chat-feed/Dockerfile
          push: false
          tags: chat-feed:ci
          cache-from: type=gha,scope=chat-feed
          cache-to: type=gha,mode=max,scope=chat-feed

  backup-restore:
    name: backup/restore (real mysql)
    needs: changes
    if: needs.changes.outputs.backup == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # backup-db.sh / restore-db.sh run unmodified; they docker-exec into DB_CONTAINER.
    services:
      mysql:
        image: mysql:8.4.4@sha256:23818b7d7de427096ab1427b2e3d9d5e14a5b933f9a4431a482d6414bc879091  # same as the VM (docker-compose.yml)
        env:
          MYSQL_ROOT_PASSWORD: ci-backup-test
        # -h127.0.0.1: the entrypoint's temporary init server has no TCP, so only the real one is "healthy"
        options: >-
          --health-cmd "mysqladmin ping -h127.0.0.1 -uroot -pci-backup-test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - name: Backup then restore, row counts must match
        run: |
          set -euo pipefail
          export DB_CONTAINER=$(docker ps --filter name=mysql --format '{{.ID}}' | head -1)
          [ -n "$DB_CONTAINER" ]
          sql() { docker exec -i "$DB_CONTAINER" sh -c 'mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -N'; }
          sql <<'SQL'
          CREATE DATABASE auth; CREATE DATABASE characters;
          CREATE TABLE auth.account (id INT PRIMARY KEY AUTO_INCREMENT, username VARCHAR(32) NOT NULL);
          CREATE TABLE characters.characters (guid INT PRIMARY KEY AUTO_INCREMENT, name VARCHAR(12) NOT NULL);
          INSERT INTO auth.account (username) VALUES ('a'),('b'),('c');
          INSERT INTO characters.characters (name) VALUES ('x'),('y'),('z'),('w'),('v');
          SQL
          count() { echo "SELECT COUNT(*) FROM $1" | sql; }
          a=$(count auth.account); c=$(count characters.characters)
          [ "$a" = 3 ]
          [ "$c" = 5 ]
          export BACKUP_DIR="$RUNNER_TEMP/backups"
          scripts/backup-db.sh
          echo "DROP DATABASE auth; DROP DATABASE characters;" | sql
          for db in auth characters; do scripts/restore-db.sh "$BACKUP_DIR"/$db-*.sql.gz; done
          [ "$(count auth.account)" = "$a" ]
          [ "$(count characters.characters)" = "$c" ]
          echo "restored: auth.account=$a characters.characters=$c"
