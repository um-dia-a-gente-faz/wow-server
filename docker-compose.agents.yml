# Five independent agent containers — one per character.
# Each has its own account, password, and character.
# Communication is in-game only (chat, party).
# Uncomment agents as you need them.

x-agent: &agent-defaults
  build: .
  image: wow-agent:latest
  restart: unless-stopped
  environment: &env-defaults
    WOW_HOST: 192.168.1.64
    WOW_AUTH_PORT: 3724
    WOW_PASSWORD: ${AGENT_PASSWORD:?set AGENT_PASSWORD in .env (see .env.example)}
    AGENT_THINK_INTERVAL_S: 5
    LOG_LEVEL: INFO
    # UM-44 think loop — optional (agent/__main__.py idles gracefully without
    # them, per its own "LLM_BASE_URL/LLM_MODEL not set" warning), but the
    # compose file must still pass them through or every agent silently
    # idles even with a real key sitting in .env. Found live 2026-09-17: the
    # key was set and working, but never reached any container because this
    # block never referenced it.
    LLM_PROVIDER: ${LLM_PROVIDER:-openai-compatible}
    LLM_BASE_URL: ${LLM_BASE_URL:-}
    LLM_API_KEY: ${LLM_API_KEY:-}
    LLM_MODEL: ${LLM_MODEL:-}
    # UM-101: Jev, the primary brain when set (agent/brain.py); empty = off.
    # Same trap as above: unless passed through here, a key in .env never
    # reaches the containers.
    JEV_BASE_URL: ${JEV_BASE_URL:-}
    JEV_API_KEY: ${JEV_API_KEY:-}
    JEV_MODEL: ${JEV_MODEL:-}
    AGENT_MAX_TOKENS_PER_HOUR: ${AGENT_MAX_TOKENS_PER_HOUR:-0}
    # UM-50 read-only observability API (agent/http_api.py). Each service
    # sets its own AGENT_HTTP_PORT and publishes it (9601-9605). Bound to
    # all interfaces inside the container so the published port works; the
    # data (position, perception, chat heard, decisions) is visible to the
    # whole LAN, but no secrets and no write endpoints. Set
    # AGENT_HTTP_PUBLISH_IP=127.0.0.1 in .env to keep it host-local.
    AGENT_HTTP_BIND: 0.0.0.0
  # Decision audit log (UM-51) — one JSONL file per agent per day. Host path
  # matches monitoring/docker-compose.yml's node-exporter textfile mount
  # input (see monitoring/agent_metrics_textfile.py), so the same directory
  # feeds both the replay viewer and the Prometheus exporter.
  volumes: &audit-volume
    - /opt/wow-server-metrics/audit:/data/audit

services:
  agent-luaprata:
    <<: *agent-defaults
    container_name: wow-agent-luaprata
    environment:
      <<: *env-defaults
      WOW_ACCOUNT: AGENT01
      WOW_CHARACTER: Luaprata
      AGENT_NAME: Luaprata
      AGENT_HTTP_PORT: 9601
    ports:
      - "${AGENT_HTTP_PUBLISH_IP:-0.0.0.0}:9601:9601"
    labels:
      wow.agent.name: Luaprata
      wow.agent.http-port: "9601"

  agent-farstrider:
    <<: *agent-defaults
    container_name: wow-agent-farstrider
    environment:
      <<: *env-defaults
      WOW_ACCOUNT: AGENT02
      WOW_CHARACTER: Farstrider
      AGENT_NAME: Farstrider
      AGENT_HTTP_PORT: 9602
    ports:
      - "${AGENT_HTTP_PUBLISH_IP:-0.0.0.0}:9602:9602"
    labels:
      wow.agent.name: Farstrider
      wow.agent.http-port: "9602"

  agent-shadowblade:
    <<: *agent-defaults
    container_name: wow-agent-shadowblade
    environment:
      <<: *env-defaults
      WOW_ACCOUNT: AGENT03
      WOW_CHARACTER: Shadowblade
      AGENT_NAME: Shadowblade
      AGENT_HTTP_PORT: 9603
    ports:
      - "${AGENT_HTTP_PUBLISH_IP:-0.0.0.0}:9603:9603"
    labels:
      wow.agent.name: Shadowblade
      wow.agent.http-port: "9603"

  agent-sunspeaker:
    <<: *agent-defaults
    container_name: wow-agent-sunspeaker
    environment:
      <<: *env-defaults
      WOW_ACCOUNT: AGENT04
      WOW_CHARACTER: Sunspeaker
      AGENT_NAME: Sunspeaker
      AGENT_HTTP_PORT: 9604
    ports:
      - "${AGENT_HTTP_PUBLISH_IP:-0.0.0.0}:9604:9604"
    labels:
      wow.agent.name: Sunspeaker
      wow.agent.http-port: "9604"

  agent-spellweaver:
    <<: *agent-defaults
    container_name: wow-agent-spellweaver
    environment:
      <<: *env-defaults
      WOW_ACCOUNT: AGENT05
      WOW_CHARACTER: Spellweaver
      AGENT_NAME: Spellweaver
      AGENT_HTTP_PORT: 9605
    ports:
      - "${AGENT_HTTP_PUBLISH_IP:-0.0.0.0}:9605:9605"
    labels:
      wow.agent.name: Spellweaver
      wow.agent.http-port: "9605"
