target-version = "py312"
extend-exclude = ["tdb"]

[lint]
# Staged (#261, #386, #413): syntax errors + pyflakes, bugbear (B), bare except (E722), blind
# except (BLE001), pyupgrade (UP) and simplify (SIM). C901 is decided, not enabled: see
# CONTRIBUTING.md, "Lint and types".
select = ["E9", "F", "B", "E722", "BLE001", "UP", "SIM"]
# UP038 (isinstance with a tuple to `X | Y`) is not applied: the union form is slower at
# runtime, which ruff's own docs call out for hot paths (#413).
ignore = ["UP038"]

# Baseline: files that already violated a rule when it was enabled. Ratchet only: fix a
# file's violations, then delete its line here. Never add a line for new code.
# F (#261) is clear: no F entry may come back. E722 had no violation, so it has no entry.
# The B entries are #386, generated with ruff 0.8.6 on main at 14e9d98. The BLE001, UP and
# SIM entries are #413, generated with ruff 0.8.6 on main at d0b7e78 after the UP and SIM
# fixes of that PR. The per-rule reasons are in the PR body.
[lint.per-file-ignores]
"agent/__main__.py" = ["BLE001"]
"agent/audit.py" = ["BLE001"]
"agent/auth.py" = ["B007", "B905"]
"agent/candidates.py" = ["BLE001"]
