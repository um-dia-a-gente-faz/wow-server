target-version = "py312"
extend-exclude = ["tdb"]

[lint]
# Conservative start (#261): syntax errors + pyflakes (undefined names, unused imports/vars).
select = ["E9", "F"]

# Baseline: files that already violate a selected rule (#261). Ratchet only: fix a
# file's violations, then delete its line here. Never add a line for new code.
[lint.per-file-ignores]
