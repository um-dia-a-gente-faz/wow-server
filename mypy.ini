# Gradual typing ratchet (#261, #350). The whole of agent/ (minus tests) is checked; every
# module sits in exactly one tier:
#   strict  - [mypy-<module>] with disallow_untyped_defs: new and already-clean modules.
#   checked - no section; the global check_untyped_defs applies. This is the default, so a
#             new agent/*.py file lands here and must type-check from day one.
#   legacy  - [mypy-<module>] ignore_errors = True, listed below. Baseline only: the list
#             may shrink, never grow (scripts/tests/test_mypy_ratchet.py enforces it).
# Move a module up a tier: see CONTRIBUTING.md "Lint and types".
[mypy]
python_version = 3.12
files = agent
exclude = ^agent/tests/
follow_imports = silent
check_untyped_defs = True
warn_unused_ignores = True

# --- strict ---
[mypy-agent.channels]
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-agent.group]
disallow_untyped_defs = True
disallow_incomplete_defs = True

