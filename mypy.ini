# Gradual typing (#261). Only the files listed in `files` are checked; imports of
# other agent modules are followed but not reported (follow_imports = silent).
# Add a module to the allowlist by appending it to `files`.
[mypy]
python_version = 3.12
files =
    agent/packets.py,
    agent/update_object.py,
    agent/router.py,
    agent/config.py,
    agent/opcodes.py
follow_imports = silent
check_untyped_defs = True
warn_unused_ignores = True
